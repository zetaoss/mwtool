# Builds the mw binaries and the GitHub release for a v* tag.
# The release workflow creates the tag from VERSION and runs this.
version: 2

project_name: mw

builds:
  - main: ./cmd/mw
    binary: mw
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mwcli/mwcli/internal/build.Version={{ .Version }}
      - -X github.com/mwcli/mwcli/internal/build.Date={{ .CommitDate }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - name_template: "mw_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

winget:
  # name is also the winget Moniker, so `winget install mw` works; the package
  # name and manifest path stay mwcli.
  - name: mw
    package_name: mwcli
    publisher: mwcli
    package_identifier: mwcli.mwcli
    path: "manifests/m/mwcli/mwcli/{{ .Version }}"
    short_description: "Unofficial but universal MediaWiki CLI. Like gh, but for MediaWiki."
    description: "mw logs in to any MediaWiki wiki, reads and edits pages and makes Action API requests from the command line."
    license: Apache-2.0
    license_url: https://github.com/mwcli/mwcli/blob/main/LICENSE
    homepage: https://github.com/mwcli/mwcli
    publisher_url: https://github.com/mwcli
    publisher_support_url: https://github.com/mwcli/mwcli/issues
    release_notes_url: "https://github.com/mwcli/mwcli/releases/tag/{{ .Tag }}"
    tags: [mediawiki, wiki, wikipedia, cli]
    # Prereleases are not submitted.
    skip_upload: auto
    commit_author:
      name: mwcli-release
      email: mwcli-release@users.noreply.github.com
    repository:
      owner: mwcli
      name: winget-pkgs
      branch: "mwcli.mwcli-{{ .Version }}"
      # A token that can push to mwcli/winget-pkgs and open pull requests on
      # microsoft/winget-pkgs. The release workflow always sets it from the
      # MWCLI_RELEASE_TOKEN secret; GoReleaser OSS has no envOrDefault.
      token: "{{ .Env.MWCLI_RELEASE_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  # Published by the workflow after every upload, so a failed run can resume.
  draft: true
  prerelease: auto
  use_existing_draft: true
  replace_existing_artifacts: true
  footer: |
    ## Install

    ```sh
    go install github.com/mwcli/mwcli/cmd/mw@v{{ .Version }}
    ```

    or download an archive below.
